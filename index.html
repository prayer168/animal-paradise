/* Layout: full-screen 3D tabletop; HUD floats on the edges like game pieces; dialogs are chunky "board game cards". */
:root{
  --sky:#BFE3EE;
  --grass:#7CC47A;
  --leaf:#2F7D4F;
  --leaf-deep:#1D5135;
  --ink:#1D2A25;
  --muted:#5A6B62;
  --card:#FFFFFF;
  --mist:#EAF5EE;
  --sun:#F4B227;
  --berry:#D8473C;
  --sea:#1F7FB8;
  --font-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r:14px;
  color-scheme:light;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent;font-size:15px}
#app{position:fixed;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--font-display);cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.btn{border:3px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 16px;font-size:1rem;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn.green{background:var(--leaf);color:#fff}
.btn.red{background:var(--berry);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn.small{padding:6px 10px;font-size:.88rem;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.emo{font-family:var(--emoji)}

/* ---------- Setup ---------- */
#setup{position:absolute;inset:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.setup-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.title-block{text-align:center;padding-block:8px}
.title-block h1{font-family:var(--font-display);font-size:clamp(2.3rem,8vw,4rem);margin:0;color:var(--leaf-deep);letter-spacing:.06em;text-shadow:0 3px 0 #fff,0 6px 0 rgba(29,42,37,.18);text-wrap:balance}
.title-block p{margin:6px 0 0;font-size:1.05rem;color:var(--ink)}
.title-block .en{font-family:var(--font-display);font-size:.85rem;letter-spacing:.3em;color:var(--leaf);text-transform:uppercase}
.panel{background:rgba(255,255,255,.93);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--font-display);font-size:1.2rem;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:7px 12px;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.seats{display:grid;gap:10px}
.seat{border:2px solid var(--ink);border-radius:14px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;background:var(--mist)}
.seat .avatar{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:30px;background:#fff;grid-row:span 2}
.seat-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.seat-top input{flex:1 1 120px;min-width:0;border:2px solid var(--ink);border-radius:10px;padding:7px 10px;font-size:1rem;font-family:var(--font-body)}
.charpick{display:flex;gap:6px;flex-wrap:wrap}
.charpick button{width:42px;height:42px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-size:24px;font-family:var(--emoji);padding:0}
.charpick button[aria-pressed="true"]{background:var(--sun);transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}
.charpick button.taken{opacity:.35}
.seat-skill{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.seat-skill b{color:var(--ink)}
.typebtn{border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:.88rem;background:#fff}
.typebtn.cpu{background:var(--ink);color:#fff}
.start-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.start-row .btn{font-size:1.15rem;padding:12px 22px}
label.lab{font-weight:700;font-size:.95rem;min-width:5.5em}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#players{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;pointer-events:auto}
#players::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;min-width:140px;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:6px 10px 6px 6px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 0 var(--ink);transition:transform .2s;position:relative}
.pchip.active{transform:translateY(3px);background:#FFF6D9}
.pchip.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-9px;height:5px;border-radius:5px;background:var(--pc)}
.pchip.out{opacity:.45;filter:grayscale(1)}
.pchip .pa{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--pc);border:2px solid var(--ink);font-family:var(--emoji)}
.pchip .pn{font-family:var(--font-display);font-size:.9rem;line-height:1.1;white-space:nowrap}
.pchip .pm{font-weight:900;font-variant-numeric:tabular-nums;font-size:1rem}
.pchip .ps{font-size:.75rem;color:var(--muted);white-space:nowrap}
#topbar{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:86px;display:flex;flex-direction:column;gap:8px}
#topbar button{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);font-size:20px;font-family:var(--emoji);padding:0}
#roundInfo{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:86px;background:var(--ink);color:#fff;border-radius:10px;padding:5px 10px;font-family:var(--font-display);font-size:.9rem}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end}
#rollBtn{font-size:1.35rem;padding:14px 28px;border-radius:16px;background:var(--sun)}
#rollBtn .emo{font-size:1.4rem}
#itemBtn{padding:12px 16px}
#dock .hint{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:8px;font-size:.85rem;white-space:nowrap}
#log{position:absolute;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(300px,38vw);max-height:30vh;overflow-y:auto;background:rgba(255,255,255,.88);border:2px solid var(--ink);border-radius:12px;padding:6px 8px;font-size:.8rem;line-height:1.45}
#log .le{display:flex;gap:6px;align-items:baseline}
#log .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;transform:translateY(-1px)}
#log.collapsed{max-height:2.2em;overflow:hidden}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0}
#banner .bt{display:inline-block;background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:12px 26px;font-family:var(--font-display);font-size:clamp(1.4rem,5vw,2.2rem);box-shadow:0 6px 0 var(--ink)}
#banner .bs{display:block;font-family:var(--font-body);font-size:.95rem;color:var(--muted);margin-top:2px}
#banner.show{animation:bannerIn 1.3s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.floater{position:absolute;font-family:var(--font-display);font-size:1.4rem;font-weight:900;pointer-events:none;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:floatUp 1.4s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
@keyframes floatUp{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-70px}}
#tileInfo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,calc(100vw - 32px));background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);padding:14px;font-size:.92rem}
#tileInfo h3{margin:0 0 6px;font-family:var(--font-display);font-size:1.25rem}

/* ---------- Modal ---------- */
#modal{position:absolute;inset:0;background:rgba(29,42,37,.42);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;z-index:20}
.mcard{width:min(460px,100%);max-height:calc(100% - 8px);overflow-y:auto;background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;animation:pop .22s ease-out}
.mcard.wide{width:min(640px,100%)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.mhead{display:flex;gap:12px;align-items:center}
.mhead .big{font-size:44px;font-family:var(--emoji);line-height:1}
.mhead h3{margin:0;font-family:var(--font-display);font-size:1.4rem;text-wrap:balance}
.mhead .sub{font-size:.85rem;color:var(--muted)}
.mbody{font-size:1rem;line-height:1.6}
.mbody p{margin:0 0 6px}
.fact{background:var(--mist);border:2px dashed var(--leaf);border-radius:12px;padding:8px 10px;font-size:.92rem;line-height:1.5}
.fact::before{content:"🔎 小知識　";font-family:var(--emoji);font-weight:700;color:var(--leaf-deep)}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.mbtns .btn{flex:1 1 auto}
.speak-control{align-self:flex-start;font-size:.9rem}
.cardface{border-radius:14px;padding:14px;color:#fff;font-family:var(--font-display);font-size:1.15rem;line-height:1.5}
.cardface.chance{background:linear-gradient(135deg,#F49B1C,#E5672A)}
.cardface.fate{background:linear-gradient(135deg,#5B5FC7,#3A3F9E)}
.cardface .ct{font-size:.85rem;letter-spacing:.3em;opacity:.85}
.opts{display:grid;gap:8px}
.opts button{text-align:left;font-family:var(--font-body);font-size:1rem;border:3px solid var(--ink);background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 3px 0 var(--ink)}
.opts button.right{background:#BFE8C6}
.opts button.wrong{background:#F6C2BC}
.numgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.numgrid button{aspect-ratio:1;max-width:100%;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:1.2rem;font-family:var(--font-display);box-shadow:0 3px 0 var(--ink)}
.items{display:grid;gap:8px}
.items button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px 10px;box-shadow:0 3px 0 var(--ink);font-family:var(--font-body)}
.items button .ie{grid-row:span 2;font-size:28px;font-family:var(--emoji);align-self:center}
.items button b{font-family:var(--font-display);font-size:1rem}
.items button small{color:var(--muted)}
.items button:disabled{opacity:.5}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--mist);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.timer{height:10px;border-radius:6px;background:var(--mist);overflow:hidden;border:2px solid var(--ink)}
.timer i{display:block;height:100%;background:var(--sun);transition:width .2s linear}
.mini-animal{text-align:center;font-size:56px;font-family:var(--emoji);line-height:1.1}
.mini-name{text-align:center;font-family:var(--font-display);font-size:1.4rem}
.mini-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.rank{width:100%;border-collapse:collapse;font-size:.95rem}
.rank th,.rank td{padding:6px 4px;border-bottom:2px solid var(--mist);text-align:left}
.rank td.n{text-align:right;font-variant-numeric:tabular-nums}
.rules h4{font-family:var(--font-display);margin:10px 0 4px;font-size:1.05rem}
.rules ul{margin:0;padding-left:1.2em}
.rules li{margin:2px 0}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:.8rem;background:var(--mist);margin:2px 2px 0 0}
@media (max-width:620px){
  #log{width:calc(100vw - 32px);max-height:18vh;bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .pchip{min-width:118px;padding:4px 8px 4px 4px}
  .pchip .pa{width:32px;height:32px;font-size:19px}
  #rollBtn{font-size:1.15rem;padding:12px 20px}
}
@media (prefers-reduced-motion:reduce){
  #banner.show{animation-duration:.01s}
  .mcard{animation:none}
}
#dock{width:max-content;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center;gap:6px}
#dock .btn{font-size:.95rem;padding:10px 12px}
.mission-card{background:var(--mist);border:2px solid var(--ink);border-radius:12px;padding:12px;margin:10px 0}
.mission-card progress{width:100%;accent-color:#2E9E5B}
.trade-form{display:grid;gap:12px}.trade-form label{display:grid;gap:5px}.trade-form select,.trade-form input{font:inherit;padding:10px;max-width:100%;width:100%;border:2px solid var(--ink);border-radius:8px}
@media(max-height:520px){#topbar{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 150px);gap:5px}#topbar button{width:36px;height:36px;font-size:17px}#log{max-height:18vh;bottom:100px}}
@media(max-width:620px){#dock{width:calc(100vw - 20px)}#dock .btn{padding:9px 8px;font-size:.85rem}#log{bottom:150px;max-height:15vh}}

/* One-screen game layout: content reflows; panels fit the visual viewport. */
html,body,#app{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
#app{height:var(--game-height,100dvh);width:var(--game-width,100vw)}
#setup{display:grid;place-items:center;padding:8px;overflow:hidden}
.setup-inner{width:min(1080px,calc(var(--game-width,100vw) - 16px));max-width:none;height:auto;gap:8px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-areas:"title title" "resume resume" "mode seats" "settings seats" "actions actions";align-items:start}
.title-block{grid-area:title;padding:0}.title-block h1{font-size:32px;line-height:1.15}.title-block .en{font-size:11px;letter-spacing:.12em}.title-block p{display:none}
#continuePanel{grid-area:resume;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}#continuePanel h2{font-size:14px}#continuePanel .row:last-child{grid-column:2;grid-row:1/3}#continueInfo{font-size:12px}
#setupModePanel{grid-area:mode}#setupSeatPanel{grid-area:seats}#setupSettingsPanel{grid-area:settings}.start-row{grid-area:actions}
#setup .panel{padding:10px;gap:7px;box-shadow:0 3px 0 var(--ink)}#setup .panel h2{font-size:16px}#setup .row{gap:5px}#setup label.lab{min-width:0;font-size:13px}#setup .seg{gap:4px}#setup .seg button{font-size:13px;padding:6px 9px;min-height:32px}
#seatNav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}#seatNav button{border:2px solid var(--ink);border-radius:8px;background:white;padding:5px 2px;min-height:34px;font-size:15px}#seatNav button[aria-pressed=true]{background:var(--sun)}
.seats{display:block}.seat{padding:8px;gap:6px;grid-template-columns:40px 1fr}.seat .avatar{width:40px;height:40px;font-size:24px;grid-row:auto}.seat-top{gap:5px}.seat-top input{flex:1 1 70px;width:70px;font-size:14px;padding:5px}.typebtn{font-size:12px;padding:5px 8px}.charpick{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.charpick button{width:100%;height:36px;font-size:23px}.seat-skill{font-size:12px;line-height:1.5}.seat-note{font-size:11px!important;line-height:1.35}
.start-row .btn{font-size:16px;padding:9px 18px;min-height:40px}
#players{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));overflow:hidden;gap:5px;padding-bottom:8px;align-items:stretch}
.pchip{min-width:0;padding:4px;gap:4px;box-shadow:0 2px 0 var(--ink)}.pchip .pa{flex:0 0 auto;width:30px;height:30px;font-size:20px}.pchip>div:last-child{min-width:0}.pchip .pn{white-space:normal;overflow-wrap:anywhere;font-size:12px}.pchip .pm{font-size:13px}.pchip .ps{white-space:normal;overflow-wrap:anywhere;font-size:10px;line-height:1.3}
#roundInfo{top:calc(var(--players-height,70px) + 10px);font-size:12px;padding:5px 7px}
#topbar{top:calc(var(--players-height,70px) + 10px);right:8px;display:flex;flex-direction:row;flex-wrap:nowrap;gap:4px;max-width:none}
#topbar button{width:clamp(30px,4vw,44px);height:clamp(30px,4vw,44px);font-size:18px;border-width:2px;border-radius:8px}
#log,#log.collapsed{overflow:hidden;max-height:none;bottom:calc(var(--dock-height,50px) + 36px);width:min(300px,calc(100vw - 16px));font-size:11px;cursor:pointer}
#dock{gap:5px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}#dock .btn,#itemBtn{padding:10px 9px;font-size:14px;min-height:40px}#dock .hint{font-size:12px;margin-bottom:6px}
#modal{padding:10px;overflow:hidden}.mcard{max-height:none;max-width:none;overflow:visible;animation:none;padding:14px;gap:10px}.mhead .big{font-size:32px}.mhead h3{font-size:21px}.mhead .sub{font-size:12px}.mbody{font-size:14px;line-height:1.5}.mbtns{gap:6px}.mbtns .btn{font-size:14px;padding:9px 12px;min-height:36px}.mbody p{overflow-wrap:anywhere}.opts button{font-size:14px;padding:8px 10px}

<body>

<div id="app">
  <canvas id="scene" aria-label="3D 遊戲棋盤"></canvas>

  <section id="setup">
    <div class="setup-inner">
      <div class="title-block">
        <div class="en">Animal Kingdom Tycoon</div>
        <h1>動物王國大亨</h1>
        <p>擲骰子環遊六大棲地，買下動物保護區、蓋保育設施，答對自然科學題賺獎金！</p>
      </div>

      <div class="panel" id="continuePanel" hidden>
        <h2>上次的遊戲還沒結束</h2>
        <div class="row"><span id="continueInfo"></span></div>
        <div class="row"><button class="btn green" id="continueBtn">繼續遊戲</button><button class="btn small" id="discardBtn">放棄存檔</button></div>
      </div>

      <div class="panel" id="setupModePanel">
        <h2>1. 選擇模式</h2>
        <div class="seg" id="modeSeg">
          <button type="button" data-mode="solo" aria-pressed="true">單人對電腦</button>
          <button type="button" data-mode="multi" aria-pressed="false">多人輪流玩</button>
        </div>
        <div class="row"><label class="lab">遊戲人數</label><div class="seg" id="countSeg"></div></div>
      </div>

      <div class="panel" id="setupSeatPanel">
        <h2>2. 選擇角色</h2>
        <div id="seatNav" aria-label="選擇要編輯的玩家"></div>
        <div class="seats" id="seats"></div>
        <div class="seat-note" style="color:var(--muted)">點上方玩家編號編輯；每人選不同角色。點「玩家／電腦」切換操作者。</div>
      </div>

      <div class="panel" id="setupSettingsPanel">
        <h2>3. 遊戲設定</h2>
        <div class="row"><label class="lab">電腦難度</label><div class="seg" id="diffSeg">
          <button type="button" data-v="easy" aria-pressed="false">簡單</button>
          <button type="button" data-v="normal" aria-pressed="true">普通</button>
          <button type="button" data-v="hard" aria-pressed="false">奸詐</button></div></div>
        <div class="row"><label class="lab">回合上限</label><div class="seg" id="roundSeg">
          <button type="button" data-v="10" aria-pressed="false">⚡ 10 回合短局</button>
          <button type="button" data-v="20" aria-pressed="false">20 回合</button>
          <button type="button" data-v="30" aria-pressed="true">30 回合</button>
          <button type="button" data-v="0" aria-pressed="false">無限</button></div></div>
      </div>

      <div class="start-row">
        <button class="btn" id="rulesBtn">📖 規則說明</button>
        <button class="btn primary" id="startBtn">開始遊戲 ▶</button>
      </div>
    </div>
  </section>

  <div id="hud" hidden>
    <div id="players"></div>
    <div id="roundInfo">第 1 回合</div>
    <div id="topbar">
      <button id="viewBtn" title="切換總覽／跟隨鏡頭" aria-label="切換鏡頭">🗺️</button>
      <button id="soundBtn" title="音效開關" aria-label="音效開關">🔊</button>
      <button id="fastBtn" title="電腦回合快轉" aria-label="電腦回合快轉">⏩</button>
      <button id="qualityBtn" title="切換輕量／精緻畫質" aria-label="切換畫質">🌿</button>
      <button id="helpBtn" title="規則說明" aria-label="規則說明">📖</button>
      <button id="menuBtn" title="選單" aria-label="選單">☰</button>
    </div>
    <div id="log" title="點一下展開或收合"></div>
    <div id="dock" hidden>
      <span class="hint" id="dockHint">輪到你了！</span>
      <button class="btn" id="missionBtn">🎯 任務</button><button class="btn" id="tradeBtn">🤝 交易</button><button class="btn" id="skillBtn">✨ 技能</button>
      <button class="btn" id="itemBtn">🎴 道具</button>
      <button class="btn primary" id="rollBtn"><span class="emo">🎲</span> 擲骰子</button>
    </div>
    <div id="banner"><span class="bt"><span id="bannerText"></span><span class="bs" id="bannerSub"></span></span></div>
    <div id="tileInfo" hidden></div>
  </div>

  <div id="modal" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true"></div></div>
</div>

<script>
// Load Three.js r160 (UMD build) from cdnjs, falling back to jsDelivr / unpkg.
(function(){
  const urls=[
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
    'https://unpkg.com/three@0.160.0/build/three.min.js'
  ];
  let i=0;
  function next(){
    if(window.THREE){window.dispatchEvent(new Event('three-ready'));return;}
    if(i>=urls.length){document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;inset:auto 16px 16px;background:#fff;border:3px solid #1D2A25;border-radius:12px;padding:12px">3D 引擎載入失敗，請檢查網路後重新整理頁面。</p>');return;}
    const s=document.createElement('script');s.src=urls[i++];s.onload=next;s.onerror=next;document.head.appendChild(s);
  }
  next();
})();
</script>

const SND={ctx:null,on:true,
  init(){ if(this.ctx) return; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } },
  tone(f,d=.12,type='sine',v=.12,t0=0,f2=null){
    if(!this.on||!this.ctx) return; const c=this.ctx, t=c.currentTime+t0;
    const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+d+.02);
  },
  noise(d=.08,v=.08,t0=0){
    if(!this.on||!this.ctx) return; const c=this.ctx, t=c.currentTime+t0;
    const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate), data=b.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);
    const s=c.createBufferSource(); s.buffer=b; const g=c.createGain(); g.gain.value=v;
    const fl=c.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=1800;
    s.connect(fl).connect(g).connect(c.destination); s.start(t);
  },
  play(name){
    const T=(...a)=>this.tone(...a);
    switch(name){
      case 'roll': for(let i=0;i<7;i++) this.noise(.05,.12,i*.09); break;
      case 'step': T(520+rnd(80),.07,'triangle',.08); break;
      case 'coin': T(988,.08,'square',.06); T(1319,.18,'square',.06,.07); break;
      case 'pay': T(440,.12,'triangle',.1); T(330,.2,'triangle',.1,.1); break;
      case 'buy': [523,659,784,1047].forEach((f,i)=>T(f,.14,'triangle',.1,i*.07)); break;
      case 'upgrade': [392,523,659,784,988].forEach((f,i)=>T(f,.12,'square',.05,i*.06)); break;
      case 'card': T(660,.08,'sine',.1); T(880,.12,'sine',.1,.08); break;
      case 'good': [659,784,1047].forEach((f,i)=>T(f,.16,'triangle',.11,i*.1)); break;
      case 'bad': T(392,.2,'sawtooth',.06); T(311,.3,'sawtooth',.06,.18); break;
      case 'right': T(784,.1,'triangle',.12); T(1175,.25,'triangle',.12,.1); break;
      case 'wrong': T(220,.35,'square',.06,0,150); break;
      case 'spirit': T(600,.5,'sine',.08,0,1400); T(900,.5,'sine',.06,.1,1800); break;
      case 'bump': this.noise(.15,.2); T(120,.15,'sine',.2); break;
      case 'turn': T(587,.1,'triangle',.09); T(880,.14,'triangle',.09,.09); break;
      case 'win': [523,659,784,1047,784,1047,1319].forEach((f,i)=>T(f,.22,'triangle',.12,i*.14)); break;
      case 'bankrupt': [523,466,415,349,262].forEach((f,i)=>T(f,.25,'sawtooth',.05,i*.15)); break;
    }
  }
};

function disposeObject(obj){

 obj.parent?.remove(obj);
 const geometries=new Set(),materials=new Set(),textures=new Set();
 obj.traverse(n=>{if(n.geometry)geometries.add(n.geometry);if(n.material)(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>materials.add(m));});
 materials.forEach(m=>{Object.values(m).forEach(v=>{if(v?.isTexture)textures.add(v);});m.dispose();});
 textures.forEach(t=>t.dispose());geometries.forEach(g=>g.dispose());
}

  if(level===MAX_BUILD_LEVEL){

function resize(){
  const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  camera.fov=w<h?60:45; camera.updateProjectionMatrix();

let lastHop=0;
function loop(){
  const rawDt=clock.getDelta(),dt=Math.min(rawDt,.05), now=performance.now();
  if(qualityAuto&&!lightQuality){slowFrames=rawDt>.045?slowFrames+1:Math.max(0,slowFrames-1);if(slowFrames>12)setLightQuality(true,true);}
  for(let k=tweens.length-1;k>=0;k--){ const tw=tweens[k]; const t=clamp((now-tw.t0)/tw.ms,0,1); tw.fn(tw.ease(t)); if(t>=1){ tweens.splice(k,1); tw.res(); } }
  // camera
  if(view.idleSpin){ view.goalYaw+=dt*.08; }
  const k=1-Math.pow(.02,dt);
  view.target.lerp(view.goalTarget,k);
  let dy=view.goalYaw-view.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); view.yaw+=dy*k;
  view.pitch+=(view.goalPitch-view.pitch)*k; view.dist+=(view.goalDist-view.dist)*k;
  const cp=Math.cos(view.pitch);
  camera.position.set(view.target.x+view.dist*cp*Math.sin(view.yaw),view.target.y+view.dist*Math.sin(view.pitch),view.target.z+view.dist*cp*Math.cos(view.yaw));
  camera.lookAt(view.target);
  // spirits bob
  const tt=now/1000;
  W.spiritMeshes.forEach((m,i)=>{ m.position.y=1.5+Math.sin(tt*2+i)*.18; m.rotation.y=tt; });
  Object.values(W.barriers).forEach(b=>{ b.rotation.y=Math.sin(tt*3)*.1; });
  // idle bob for current token
  if(G && !G.over){ const p=G.players[G.cur]; const tok=W.tokens[p.id]; if(tok && !tok.userData.moving){ tok.userData.body && (tok.userData.body.position.y=Math.abs(Math.sin(tt*3))*.06); } }
  renderer.render(scene,camera);
}

/* ----- 鏡頭操作：拖曳旋轉、雙指/滾輪縮放、點格子看資訊 ----- */
function setupPointer(canvas){
  const pts=new Map(); let lastDist=0, moved=0, downAt=null;
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; downAt={x:e.clientX,y:e.clientY}; if(pts.size===2){ const [a,b]=[...pts.values()]; lastDist=Math.hypot(a.x-b.x,a.y-b.y);} });
  canvas.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; const prev=pts.get(e.pointerId); const cur={x:e.clientX,y:e.clientY}; pts.set(e.pointerId,cur);
    if(pts.size===1){ const dx=cur.x-prev.x, dy=cur.y-prev.y; moved+=Math.abs(dx)+Math.abs(dy); if(moved>6){ view.goalYaw-=dx*.006; view.goalPitch=clamp(view.goalPitch+dy*.004,.25,1.45); view.manualUntil=performance.now()+6000; view.idleSpin=false; } }
    else if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(lastDist){ view.goalDist=clamp(view.goalDist*lastDist/d,7,55); } lastDist=d; moved+=10; view.manualUntil=performance.now()+6000; } });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) lastDist=0; if(moved<6 && downAt && e.type==='pointerup') tapTile(e.clientX,e.clientY); downAt=null; };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); view.goalDist=clamp(view.goalDist*(e.deltaY>0?1.1:.9),7,55); view.manualUntil=performance.now()+6000; },{passive:false});
}

function tapTile(x,y){
  const info=$('#tileInfo'); if(!info) return;
  if(!info.hidden){ info.hidden=true; return; }
  if(!G || modalOpen) return;
  const rc=new THREE.Raycaster(); const v=new THREE.Vector2(x/window.innerWidth*2-1,-(y/window.innerHeight)*2+1);
  rc.setFromCamera(v,camera); const hit=rc.intersectObjects(W.tileTops,false)[0]; if(!hit) return;
  const i=hit.object.userData.tile, t=TILES[i];
  let html=`<h3><span class="emo">${t.emoji}</span> ${t.name}</h3>`;
  if(t.type==='land'){
    const st=G.tiles[i], owner=st.owner>=0?G.players[st.owner]:null;
    html+=`<div><span class="tag">${REGIONS[t.region].name}</span><span class="tag">地價 $${fmt(t.price)}</span><span class="tag">升級 $${fmt(t.up)}</span></div>
    <p style="margin:8px 0 4px">地主：${owner?`<b style="color:${owner.color}">${CHAR[owner.char].emoji} ${owner.name}</b>`:'尚未售出'}　設施：${LEVEL_NAMES[st.level]}</p>
    <p style="margin:0 0 8px">過路費：$${fmt(rentOf(i,null))}　（各級：${RENT_MULT.map(m=>fmt(t.rent*m)).join(' / ')}）</p><div class="fact">${t.fact}</div>`;
  } else html+=`<p>${SPECIAL_TXT[t.type]||''}</p>`;
  html+=`<p style="font-size:.8rem;color:var(--muted);margin:8px 0 0">點畫面任意處關閉</p>`;
  info.innerHTML=html; info.hidden=false;
}

/* ---------------- 3D 同步 ---------------- */
function tokenSlot(p){
  const sameTile=G.players.filter(q=>!q.out && q.pos===p.pos);
  const idx=sameTile.indexOf(p), n=sameTile.length;
  const base=tilePos(p.pos); const inw=inward(p.pos);
  const perp=[-inw[2],0,inw[0]];
  const cols=Math.min(n,3), row=Math.floor(idx/3), col=idx%3;
  const off=(col-(cols-1)/2)*.62;
  const back=(p.pos%9===0)?0:-.28-row*.55+ (n>3?.25:0);
  return new THREE.Vector3(base.x+perp[0]*off+inw[0]*back, TILE_TOP, base.z+perp[2]*off+inw[2]*back);
}
function placeTokens(except){
  G.players.forEach(p=>{ const tok=W.tokens[p.id]; if(!tok||p.out||p===except) return; const to=tokenSlot(p); const from=tok.position.clone();
    if(from.distanceTo(to)>.01) tween(220,t=>tok.position.lerpVectors(from,to,t),easeOut); tok.rotation.y=sideYaw(p.pos); });
}
function syncTile(i){
  const t=TILES[i]; if(t.type!=='land') return; const st=G.tiles[i];
  const g=W.tileGroups[i];
  if(W.buildings[i]){ disposeObject(W.buildings[i]); W.buildings[i]=null; }
  if(W.flags[i]){ disposeObject(W.flags[i]); W.flags[i]=null; }
  if(st.owner<0) return;
  const color=G.players[st.owner].color; const inw=inward(i);
  const owner=G.players[st.owner],flag=new THREE.Group();
  flag.userData={ownerId:owner.id,char:owner.char,logo:CHAR[owner.char].emoji};
  const [canvas,ctx]=makeCanvas(256,256);ctx.clearRect(0,0,256,256);
  ctx.beginPath();ctx.arc(128,128,116,0,Math.PI*2);ctx.fillStyle='#FFFFFF';ctx.fill();ctx.lineWidth=20;ctx.strokeStyle=color;ctx.stroke();
  ctx.font=`150px ${EMOJI_FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#222';ctx.fillText(CHAR[owner.char].emoji,128,138);
  const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;
  const badge=new THREE.Mesh(new THREE.PlaneGeometry(.63,.63),new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide,depthWrite:false}));badge.rotation.x=-Math.PI/2;flag.add(badge);
  const perp=[-inw[2],0,inw[0]];
  flag.position.set(perp[0]*.78-inw[0]*.78,TILE_TOP+.025,perp[2]*.78-inw[2]*.78);g.add(flag);W.flags[i]=flag;
  if(st.level>0){ const b=makeBuilding(st.level,color); b.position.set(inw[0]*.62,TILE_TOP,inw[2]*.62); b.rotation.y=sideYaw(i); b.scale.setScalar(.95); g.add(b); W.buildings[i]=b; }
}
async function growBuilding(i){
  syncTile(i); const b=W.buildings[i]; if(!b) return;
  burst(tilePos(i).add(new THREE.Vector3(0,1,0)),G.players[G.tiles[i].owner].color);
  await tween(650,t=>{ b.scale.set(.95,.95*Math.max(.02,t),.95); },t=>{ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); });
}
function burst(pos,color){
  const parts=[]; for(let k=0;k<14;k++){ const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),mat(k%2?color:'#FFD45C')); m.position.copy(pos); scene.add(m); parts.push({m,v:new THREE.Vector3((Math.random()-.5)*4,2+Math.random()*3,(Math.random()-.5)*4)}); }
  tween(800,t=>{ parts.forEach(p=>{ p.m.position.addScaledVector(p.v,.016); p.v.y-=.12; p.m.rotation.x+=.2; p.m.scale.setScalar(1-t); }); }).then(()=>parts.forEach(p=>{ disposeObject(p.m); }));
}
function syncBarriers(){
  Object.keys(W.barriers).forEach(k=>{ if(!G.barriers.includes(+k)){ disposeObject(W.barriers[k]); delete W.barriers[k]; } });
  G.barriers.forEach(i=>{ if(W.barriers[i]) return; const g=new THREE.Group();
    for(let k=0;k<3;k++){ const s=new THREE.Mesh(new THREE.BoxGeometry(1.2,.14,.12),mat(k%2?'#FFFFFF':'#E53935')); s.position.y=.3+k*.15; s.castShadow=true; g.add(s); }

    const p=tilePos(i); g.position.set(p.x,TILE_TOP,p.z); g.rotation.y=sideYaw(i)+Math.PI/2; scene.add(g); W.barriers[i]=g; });

function syncSpirits(){
  W.spiritMeshes.forEach(m=>disposeObject(m)); W.spiritMeshes=[];

function buildTokens(){
  Object.values(W.tokens).forEach(t=>disposeObject(t)); W.tokens={};
  G.players.forEach(p=>{ if(p.out) return; const m=makeCharModel(p.char,p.color); m.position.copy(tokenSlot(p)); m.rotation.y=sideYaw(p.pos); scene.add(m); W.tokens[p.id]=m; });

function syncAll(){ for(let i=0;i<N;i++) syncTile(i); syncBarriers(); syncSpirits(); buildTokens(); }

function focusOn(p,instant=false){

      const ended=()=>{ if(done||activeUtterance!==utterance) return; activeUtterance=null; speechButton.textContent='🔊 再唸一次'; speechButton.setAttribute('aria-label','再唸一次'); if(auto&&!userStopped) close(displayedButtons.find(b=>b.cls&&b.cls.includes('primary'))?.value??displayedButtons[0]?.value); };
      utterance.onend=ended; utterance.onerror=ended;
      window.speechSynthesis.speak(utterance);
    };
    const close=v=>{ if(done) return; done=true; clearTimeout(timer); activeUtterance=null; if('speechSynthesis' in window) window.speechSynthesis.cancel(); m.hidden=true; modalOpen=false; resolve(v); requestViewportFit(); };
    if(speechButton) speechButton.onclick=()=>{ if(window.speechSynthesis.speaking||window.speechSynthesis.pending){ userStopped=true; activeUtterance=null; window.speechSynthesis.cancel(); speechButton.textContent='🔊 再唸一次'; speechButton.setAttribute('aria-label','再唸一次'); } else readModal(); };
    c.querySelectorAll('.mbtns button').forEach(b=>b.onclick=()=>{ SND.play('turn'); const value=displayedButtons[+b.dataset.i].value;close(value==='__modal_choice__'?buttons[+c.querySelector('#modalChoice').value].value:value); });
    compactRuleView(c);
    if(onMount) onMount(c,close);
    requestViewportFit();
    if(speechButton) setTimeout(readModal,80);
    if(auto){ const def=(buttons.find(b=>b.cls&&b.cls.includes('primary'))||buttons[0]||{}).value; const fallback=speechButton?Math.min(30000,Math.max(auto*speed(),speechText().length*250+2000)):auto*speed(); timer=setTimeout(()=>close(def),fallback); }
    const first=c.querySelector('.mbtns .btn.primary')||c.querySelector('button'); if(first && !auto) setTimeout(()=>first.focus({preventScroll:true}),50);
  });
}

/* ---------------- 遊戲狀態 ---------------- */
let G=null, runToken=0, preRollResolve=null;
const SAVE_KEY='animal-kingdom-tycoon-v1';
function save(){ try{ if(G && !G.over) localStorage.setItem(SAVE_KEY,JSON.stringify(G)); }catch(e){} }
function validSave(s){
 if(!s||![1,2,3].includes(s.v)||!s.settings||!['easy','normal','hard'].includes(s.settings.diff)||![0,10,20,30].includes(s.settings.rounds))return false;
 if(!Array.isArray(s.players)||s.players.length<2||s.players.length>6||!Number.isInteger(s.cur)||s.cur<0||s.cur>=s.players.length||!Number.isInteger(s.round)||s.round<1)return false;
 if(!Array.isArray(s.tiles)||s.tiles.length!==N||!s.tiles.every(t=>t&&Number.isInteger(t.owner)&&t.owner>=-1&&t.owner<s.players.length&&Number.isInteger(t.level)&&t.level>=0&&t.level<=MAX_BUILD_LEVEL))return false;
 if(!['log','barriers','spirits','quizUsed'].every(k=>Array.isArray(s[k])))return false;
 if(!s.players.every((p,i)=>p&&p.id===i&&CHAR[p.char]&&typeof p.name==='string'&&Number.isFinite(p.cash)&&p.cash>=0&&Number.isFinite(p.deposit)&&p.deposit>=0&&Number.isInteger(p.pos)&&p.pos>=0&&p.pos<N&&Number.isInteger(p.turns)&&p.turns>=0&&Number.isInteger(p.skip)&&p.skip>=0&&Array.isArray(p.items)&&p.items.every(k=>ITEMS[k])&&Array.isArray(p.facts)&&(!p.spirit||SPIRITS[p.spirit.type])))return false;
 if(!s.barriers.every(i=>Number.isInteger(i)&&i>=0&&i<N)||!s.spirits.every(v=>v&&SPIRITS[v.type]&&Number.isInteger(v.tile)&&v.tile>=0&&v.tile<N)||!s.quizUsed.every(i=>Number.isInteger(i)&&i>=0&&i<QUIZ.length))return false;
 if(!s.log.every(e=>e&&typeof e.t==='string'&&typeof e.c==='string'))return false;
 return s.players.every(p=>!p.missions||(Array.isArray(p.missions)&&p.missions.every(m=>m&&MISSIONS.some(d=>d.id===m.id)&&typeof m.done==='boolean')));
}
function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const s=JSON.parse(raw);return validSave(s)?s:null;}catch(e){return null;}}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function newGame(seats,settings){
  G={v:1,settings,round:1,cur:0,over:false,log:[],barriers:[],spirits:[],quizUsed:[],
    tiles:TILES.map(()=>({owner:-1,level:0})),
    players:seats.map((s,i)=>{ const c=CHAR[s.char]; const p={id:i,name:String(s.name||c.short).replace(/[&<>"']/g,'').slice(0,12)||c.short,char:s.char,color:c.color,cpu:s.cpu,cash:START_CASH,deposit:0,pos:0,skip:0,jail:false,items:[],spirit:null,reverse:false,out:false,turns:0,quizR:0,quizT:0,facts:[]};
      if(s.char==='rabbit') p.items.push('remote'); if(s.char==='monkey') p.items.push('demolish'); p.items.push(pick(['free','barrier','remote'])); return p; })};
  initExpansion(); log('遊戲開始！每人起始資金 $20,000，完成祕密任務可領獎金。');
}

function addFact(p,f){ if(f && !p.facts.includes(f)) p.facts.push(f); }
function gain(p,amt,reason=''){ p.cash+=amt; floatText(p,'+$'+fmt(amt),'#2E9E5B'); SND.play('coin'); if(reason) log(`${p.name} ${reason}，獲得 $${fmt(amt)}`,p); renderPlayers(); }
function alive(){ return G.players.filter(p=>!p.out); }
function sellOne(p){
  let best=null;
  G.tiles.forEach((st,i)=>{ if(st.owner!==p.id) return; const val=st.level>0?lastBuildCost(i,st.level):TILES[i].price; if(!best||val<best.val) best={i,val,st}; });
  if(!best) return false;
  const t=TILES[best.i];
  if(best.st.level>0){ const refund=Math.round(lastBuildCost(best.i,best.st.level)*.5); best.st.level--; p.cash+=refund; log(`${p.name} 賣掉「${t.name}」一級設施，拿回 $${fmt(refund)}`,p); }
  else { best.st.owner=-1; p.cash+=Math.round(t.price*.5); log(`${p.name} 賣掉土地「${t.name}」，拿回 $${fmt(t.price*.5)}`,p); }
  syncTile(best.i); return true;
}
async function pay(p,amt,to=null,reason=''){
  amt=Math.round(amt); if(amt<=0) return 0;
  if(p.cash<amt && p.deposit>0){ const w=Math.min(amt-p.cash,p.deposit); p.deposit-=w; p.cash+=w; log(`${p.name} 現金不夠，自動從銀行領出 $${fmt(w)}`,p); }
  while(p.cash<amt){ if(!sellOne(p)) break; }
  const paid=Math.min(p.cash,amt); p.cash-=paid; if(to){ to.cash+=paid; floatText(to,'+$'+fmt(paid),'#2E9E5B'); }
  floatText(p,'-$'+fmt(paid),'#D8473C'); SND.play('pay');
  if(reason) log(`${p.name} ${reason}，付出 $${fmt(paid)}`+(to?` 給 ${to.name}`:''),p);
  renderPlayers();
  if(paid<amt) await bankrupt(p);
  return paid;
}
async function bankrupt(p){
  p.out=true; p.cash=0; p.deposit=0; p.items=[]; p.spirit=null;
  G.tiles.forEach((st,i)=>{ if(st.owner===p.id){ st.owner=-1; st.level=0; syncTile(i); } });
  const tok=W.tokens[p.id]; if(tok){ await tween(600,t=>{ tok.scale.setScalar(1-t); tok.rotation.y+=.3; }); disposeObject(tok); delete W.tokens[p.id]; }
  SND.play('bankrupt'); log(`${p.name} 破產出局了！`,p); renderPlayers();
  await modal({emoji:CHAR[p.char].emoji,title:`${p.name} 破產了`,body:`<p>所有土地都還給動物王國，${p.name} 退出這局遊戲。</p>`,auto:alive().some(q=>!q.cpu)?0:2500});
}

/* ---------------- 回合流程 ---------------- */
async function gameLoop(token){
  while(token===runToken && !G.over){
    const p=G.players[G.cur];
    if(!p.out){ await playTurn(p,token); }
    if(token!==runToken || G.over) return;
    if(alive().length<=1){ await endGame(); return; }
    // next player
    let wrapped=false;
    do{ G.cur=(G.cur+1)%G.players.length; if(G.cur===0) wrapped=true; } while(G.players[G.cur].out);
    if(wrapped){ G.round++; if(G.settings.rounds && G.round>G.settings.rounds){ G.round=G.settings.rounds; await endGame(); return; } await newRound(); }
    renderPlayers(); save();
  }
}
async function newRound(){
  log(`—— 第 ${G.round} 回合 ——`);
  if(G.spirits.length<2 && Math.random()<.45){
    const free=[]; for(let i=1;i<N;i++){ if(i%9===0) continue; if(G.spirits.some(s=>s.tile===i)||G.players.some(p=>!p.out&&p.pos===i)) continue; free.push(i); }
    if(free.length){ const type=pick(Object.keys(SPIRITS)); const tile=pick(free); G.spirits.push({type,tile}); syncSpirits(); log(`${SPIRITS[type].emoji} ${SPIRITS[type].name} 出現在「${TILES[tile].name}」！`); SND.play('spirit'); }
  }
}

async function playTurn(p,token){
  $('#helpBtn').disabled=true;$('#menuBtn').disabled=true;
  if(!p.prepared) p.turns++; renderPlayers(); focusOn(p); view.idleSpin=false;
  SND.play('turn'); banner(`輪到 ${p.name}`,p.cpu?'電腦思考中…':`「${CHAR[p.char].quote}」`);
  await wait(900); if(token!==runToken) return;

  if(!p.prepared && p.skip>0){
    if(p.jail){
      let bail=false;
      if(p.cpu) bail=p.cash>6000;
      else bail=await modal({emoji:'🚓',title:'你在盜獵警察局',body:`<p>還要停留 ${p.skip} 回合。要付 $1,000 保釋金，馬上出發嗎？</p>`,buttons:[{label:'等待',value:false},{label:'付 $1,000 保釋',value:true,cls:'primary',disabled:p.cash<1000}]});
      if(bail && p.cash>=1000){ await pay(p,1000,null,'付保釋金'); p.skip=0; p.jail=false; }
    }
    if(p.skip>0){
      p.skip--; if(p.skip===0) p.jail=false;
      log(`${p.name} ${TILES[p.pos].type==='police'?'在警察局':'在動物醫院'}休息，${p.skip?`還剩 ${p.skip} 回合`:'下回合可以出發'}`,p);
      floatText(p,'休息中…','#5A6B62'); renderPlayers(); await wait(900); endTick(p); return;
    }
  }

  p.prepared=true; save();
  let steps=null;
  if(p.cpu){ await cpuExpansion(p); steps=await cpuPreRoll(p); }
  else { const r=await humanPreRoll(p); steps=r.steps; }
  if(token!==runToken || p.out) return;

  if(steps==null){
    const [a,b]=await rollDice(p); steps=a+b;
    let note=`${p.name} 擲出 ${a} + ${b} = ${steps}`;
    if(p.spirit && p.spirit.type==='lazy'){ steps=Math.max(1,Math.ceil(steps/2)); note+=`，懶惰蟲讓步數減半 → ${steps}`; }
    if(p.char==='bear' && p.turns%3===0){ steps+=1; note+='，好運步伐 +1'; }
    log(note,p);
  } else log(`${p.name} 使用遙控骰子，走 ${steps} 步`,p);

  const dir=p.reverse?-1:1; if(p.reverse){ log(`${p.name} 被轉向了，這次倒著走！`,p); p.reverse=false; }
  await moveSteps(p,steps,dir);
  hideDice();
  if(token!==runToken) return;
  await landOn(p,0);
  if(token!==runToken) return;
  endTick(p);
}
function endTick(p){
  p.prepared=false; checkMissions(p);
  if(p.spirit){ p.spirit.left--; if(p.spirit.left<=0){ log(`${SPIRITS[p.spirit.type].name} 離開了 ${p.name}`,p); p.spirit=null; } }
  renderPlayers();
}

function humanPreRoll(p){
  return new Promise(res=>{
    preRollResolve=res;$('#helpBtn').disabled=false;$('#menuBtn').disabled=false;
    $('#dock').hidden=false; $('#dockHint').textContent=`輪到 ${p.name}！`; updateExpansionDock(p);
    $('#itemBtn').textContent=`🎴 道具 ${p.items.length}`; $('#itemBtn').disabled=p.items.length===0;
    $('#rollBtn').disabled=false; setTimeout(()=>$('#rollBtn').focus({preventScroll:true}),30);
  });
}
function finishPreRoll(result){ if(!preRollResolve) return; $('#helpBtn').disabled=true;$('#menuBtn').disabled=true; const r=preRollResolve; preRollResolve=null; $('#dock').hidden=true; r(result); }

async function rollDice(p){
  SND.play('roll');
  const vals=[1+rnd(6),1+rnd(6)];
  const tok=W.tokens[p.id]; const base=tok?tok.position.clone():tilePos(p.pos);
  const inw=inward(p.pos); const perp=[-inw[2],0,inw[0]];
  const dur=1000*speed();
  await Promise.all(W.dice.map((d,k)=>{
    d.visible=true; const cube=d.userData.cube; const tgt=DIE_ROT[vals[k]];
    const extra=[Math.PI*2*(2+rnd(2)),0,Math.PI*2*(1+rnd(2))];
    d.rotation.y=Math.random()*Math.PI*2;
    const end=new THREE.Vector3(base.x+inw[0]*1.3+perp[0]*(k?.6:-.6),TILE_TOP+.4,base.z+inw[2]*1.3+perp[2]*(k?.6:-.6));
    const start=end.clone().add(new THREE.Vector3(-inw[0]*1.5,4,-inw[2]*1.5));
    return tween(dur,t=>{
      d.position.lerpVectors(start,end,t); d.position.y=end.y+(start.y-end.y)*(1-t)*(1-t)+Math.abs(Math.sin(t*Math.PI*3))*(1-t)*1.2;
      cube.rotation.set(tgt[0]+extra[0]*(1-t),tgt[1],tgt[2]+extra[2]*(1-t));
    },easeOut);
  }));
  SND.play('bump');
  floatText(p,`🎲 ${vals[0]+vals[1]}`,'#1D2A25');
  await wait(450);
  return vals;
}
function hideDice(){ W.dice.forEach(d=>d.visible=false); }

async function hop(p,to){
  const tok=W.tokens[p.id]; if(!tok) return;
  tok.userData.moving=true;
  const from=tok.position.clone();
  const others=G.players.filter(q=>q!==p && !q.out && q.pos===to).length;
  p.pos=to; const dest=others?tokenSlot(p):tilePos(to).setY(TILE_TOP);
  const yaw0=tok.rotation.y, yaw1=sideYaw(to); let dy=yaw1-yaw0; dy=Math.atan2(Math.sin(dy),Math.cos(dy));
  await tween(230*speed(),t=>{ tok.position.lerpVectors(from,dest,t); tok.position.y=TILE_TOP+Math.sin(t*Math.PI)*.8; tok.rotation.y=yaw0+dy*t; });
  SND.play('step'); tok.userData.moving=false;
  focusOn(p);
}
async function moveSteps(p,steps,dir=1){
  for(let s=0;s<steps;s++){
    const to=(p.pos+dir+N)%N;
    await hop(p,to);
    if(dir>0 && to===0) await passStart(p);
    const bi=G.barriers.indexOf(to);
    if(bi>=0 && s<steps-1){ G.barriers.splice(bi,1); syncBarriers(); SND.play('bump'); floatText(p,'🚧 被擋下！','#D8473C'); log(`${p.name} 被路障擋在「${TILES[to].name}」`,p); await wait(500); break; }
    if(bi>=0){ G.barriers.splice(bi,1); syncBarriers(); }
  }
  placeTokens();
}
async function passStart(p){
  gain(p,PASS_START,'經過起點');
  if(p.deposit>0){ const rate=p.char==='peacock'?.10:.05; const it=Math.round(p.deposit*rate); p.deposit+=it; log(`${p.name} 的存款產生利息 $${fmt(it)}`,p); renderPlayers(); }
}
async function moveTo(p,target,depth){
  let steps=(target-p.pos+N)%N; if(steps===0) steps=N;
  await moveSteps(p,steps,1); await landOn(p,depth+1);
}
async function jumpTo(p,target){
  const tok=W.tokens[p.id]; const from=tok.position.clone(); p.pos=target; const dest=tokenSlot(p);
  tok.userData.moving=true;
  await tween(700*speed(),t=>{ tok.position.lerpVectors(from,dest,t); tok.position.y=TILE_TOP+Math.sin(t*Math.PI)*4; tok.rotation.y+=.25; },easeInOut);
  tok.rotation.y=sideYaw(target); tok.userData.moving=false; placeTokens(); focusOn(p);
}

/* ---------------- 落點事件 ---------------- */
async function landOn(p,depth){
  if(p.out) return;
  const t=TILES[p.pos];
  const si=G.spirits.findIndex(s=>s.tile===p.pos);
  if(si>=0){ const type=G.spirits[si].type; G.spirits.splice(si,1); syncSpirits(); await attachSpirit(p,type); }
  switch(t.type){
    case 'land': await landLand(p); break;
    case 'chance': case 'fate': await drawCard(p,t.type,depth); break;
    case 'quiz': await doQuiz(p); break;
    case 'supply': { const it=pick(ITEM_POOL); await giveItem(p,it,'神秘補給站送你'); break; }
    case 'hospital': p.skip=1; p.jail=false; SND.play('bad'); log(`${p.name} 走進動物醫院，休息 1 回合`,p);
      await modal({emoji:'🏥',title:'動物醫院',body:'<p>幫受傷的動物做檢查，下一回合休息。</p><div class="fact">野生動物救傷後，要評估能不能回到野外生活才會野放。</div>',auto:p.cpu?1500:0}); break;
    case 'police': p.skip=2; p.jail=true; SND.play('bad'); log(`${p.name} 進了盜獵警察局，停留 2 回合`,p);
      await modal({emoji:'🚓',title:'盜獵警察局',body:'<p>配合調查盜獵案件，停留 2 回合（可以付 $1,000 保釋）。</p><div class="fact">台灣的保育類野生動物分成三級：瀕臨絕種、珍貴稀有、其他應予保育。</div>',auto:p.cpu?1500:0}); break;
    case 'park': {
      let msg='<p>在大樹下乘涼，好好休息一下。</p>';
      if(p.spirit && !SPIRITS[p.spirit.type].good){ msg+=`<p>清新的空氣趕走了 ${SPIRITS[p.spirit.type].emoji}${SPIRITS[p.spirit.type].name}！</p>`; p.spirit=null; renderPlayers(); }
      await modal({emoji:'🌳',title:'大樹公園',body:msg+'<div class="fact">一棵大樹一年可以吸收大約 20 公斤以上的二氧化碳。</div>',auto:p.cpu?1500:0}); break; }
    case 'bank': await doBank(p); break;
    case 'mini': await doMini(p); break;
    case 'start': break;
  }
  renderPlayers();
}

async function attachSpirit(p,type){
  const sp=SPIRITS[type]; p.spirit={type,left:sp.turns}; SND.play(sp.good?'spirit':'bad');
  log(`${sp.emoji} ${sp.name} 附在 ${p.name} 身上（${sp.turns} 回合）`,p); renderPlayers();
  await modal({emoji:sp.emoji,title:`${sp.name} 附身！`,body:`<p>${sp.desc}，持續 ${sp.turns} 回合。</p>`,auto:p.cpu?1500:0});
}

function regionFull(i){ const t=TILES[i], o=G.tiles[i].owner; if(o<0) return false; return TILES.every((u,j)=>u.type!=='land'||u.region!==t.region||G.tiles[j].owner===o); }
function rentOf(i,payer){
  const t=TILES[i], st=G.tiles[i]; if(st.owner<0) return 0; const owner=G.players[st.owner];
  let r=t.rent*RENT_MULT[st.level]; if(regionFull(i)) r*=2;
  if(owner.spirit && owner.spirit.type==='harvest') r*=2;
  if(payer && payer.spirit && payer.spirit.type==='pollution') r*=2;
  return Math.round(r);
}
function buyCost(p,i){ return Math.round(TILES[i].price*(p.char==='fox'?.9:1)); }
function upCost(p,i){ return Math.round(lastBuildCost(i,G.tiles[i].level+1)*(p.char==='fox'?.9:1)); }

async function landLand(p){
  const i=p.pos, t=TILES[i], st=G.tiles[i]; addFact(p,t.fact);
  const head={emoji:t.emoji,sub:REGIONS[t.region].name};

async function giveItem(p,key,reason){

  p.items.push(key); SND.play('card'); log(`${p.name} ${reason}「${it.name}」`,p); renderPlayers();
  await modal({emoji:it.emoji,title:`獲得「${it.name}」`,body:`<p>${it.desc}</p>`,auto:p.cpu?1300:0});
}

async function drawCard(p,type,depth){
  const deck=type==='chance'?CHANCE:FATE;
  G.cardDecks??={};G.lastCard??={};let pile=(G.cardDecks[type]||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<deck.length);
  if(!pile.length){pile=shuffle(deck.map((_,i)=>i));if(pile.length>1&&pile[pile.length-1]===G.lastCard[type]){[pile[0],pile[pile.length-1]]=[pile[pile.length-1],pile[0]];}}
  G.cardDecks[type]=pile;const index=pile.pop();G.lastCard[type]=index;const c=deck[index]; addFact(p,c.f); SND.play('card');
  await modal({title:type==='chance'?'機會':'命運',emoji:type==='chance'?'🎲':'📜',body:`<div class="cardface ${type}"><div class="ct">${type==='chance'?'CHANCE':'FATE'}</div>${c.t}</div><div class="fact">${c.f}</div><p class="card-note">事件與獎懲為遊戲設定，並非真實法規的罰則或金額。</p>`,auto:p.cpu?2000:0});
  log(`${p.name} 抽到${type==='chance'?'機會':'命運'}：${c.t}`,p);
  const fx=c.fx;
  if(fx.money>0) gain(p,fx.money);
  if(fx.money<0) await pay(p,-fx.money,null,'');
  if(p.out)return;
  if(fx.quiz){await doQuiz(p,fx.quiz);if(p.out)return;}
  if(fx.cleanse){if(p.spirit&&!SPIRITS[p.spirit.type].good){p.spirit=null;log(`${p.name} 清除了壞精靈`,p);}else gain(p,600,'領取保育補助');}
  if(fx.upgrade){const own=G.tiles.map((s,i)=>({s,i})).filter(o=>o.s.owner===p.id&&o.s.level<MAX_BUILD_LEVEL);if(own.length){const o=pick(own);o.s.level++;log(`${p.name} 的「${TILES[o.i].name}」免費升一級`,p);await growBuilding(o.i);}else gain(p,600,'領取替代補助');}
  if(fx.collectEach){ for(const q of alive()) if(q!==p) await pay(q,fx.collectEach,p,''); }
  if(fx.payEach){ for(const q of alive()) if(q!==p && !p.out) await pay(p,fx.payEach,q,''); }
  if(fx.item) await giveItem(p,fx.item,'得到');
  if(fx.spirit) await attachSpirit(p,fx.spirit);
  if(fx.interest){ const rate=p.char==='peacock'?.10:.05; const it=Math.max(200,Math.round(p.deposit*rate)); gain(p,it,'領到存款利息'); }
  if(fx.repair){ let lv=0; G.tiles.forEach(s=>{ if(s.owner===p.id) lv+=s.level; }); if(lv) await pay(p,lv*fx.repair,null,`維修 ${lv} 級設施`); else log(`${p.name} 還沒有設施，不用維修`,p); }
  if(fx.downgrade){ const own=G.tiles.map((s,i)=>({s,i})).filter(o=>o.s.owner===p.id&&o.s.level>0); if(own.length){ const o=pick(own); o.s.level--; syncTile(o.i); SND.play('bad'); log(`「${TILES[o.i].name}」的設施降為${LEVEL_NAMES[o.s.level]}`,p); } else log(`${p.name} 沒有設施，逃過一劫`,p); }
  if(fx.loseItem){ if(p.items.length){ const k=rnd(p.items.length); const lost=p.items.splice(k,1)[0]; log(`${p.name} 遺失了「${ITEMS[lost].name}」`,p); } else log(`${p.name} 本來就沒有道具卡`,p); }
  if(fx.goto==='police'){ await jumpTo(p,27); p.skip=2; p.jail=true; }
  if(fx.goto==='hospital'){ await jumpTo(p,9); p.skip=1; p.jail=false; }
  if(fx.jumpTo!=null){ await jumpTo(p,fx.jumpTo); }
  if(p.out) return;
  if(fx.moveTo!=null){ if(depth<1) await moveTo(p,fx.moveTo,depth); else await jumpTo(p,fx.moveTo); }
  if(fx.move){ await moveSteps(p,Math.abs(fx.move),fx.move>0?1:-1); if(depth<1) await landOn(p,depth+1); }
  renderPlayers();
}

async function doQuiz(p,challenge=null){
  let q=challenge;
  if(!q){if(G.quizUsed.length>=QUIZ.length)G.quizUsed=[];let qi;do{qi=rnd(QUIZ.length);}while(G.quizUsed.includes(qi));G.quizUsed.push(qi);q=QUIZ[qi];}
  const opts=shuffle(q.o.slice()),baseReward=challenge?challenge.reward:1000;
  const reward=Math.round(baseReward*(p.char==='turtle'?1.5:1))*(p.quizBoost?2:1),penalty=challenge?challenge.penalty:300;p.quizBoost=false;
  p.quizT++;
  let correct;
  const body=`<p style="font-size:1.1rem;font-weight:700">${q.q}</p><div class="opts">${opts.map((o,k)=>`<button data-k="${k}">${'ABCD'[k]}. ${o}</button>`).join('')}</div><div id="qfb"></div>`;
  if(p.cpu){
    const rate={easy:.5,normal:.7,hard:.88}[G.settings.diff]; correct=Math.random()<rate;
    const choice=correct?q.a:pick(q.o.filter(o=>o!==q.a));
    await modal({emoji:'🔬',title:'自然科學挑戰站',sub:`答對 +$${fmt(reward)}，${penalty?`答錯 -$${fmt(penalty)}`:'答錯不扣款'}`,body,buttons:[],onMount:(c,close)=>{
      setTimeout(()=>{ c.querySelectorAll('.opts button').forEach(b=>{ const o=opts[+b.dataset.k]; if(o===q.a) b.classList.add('right'); else if(o===choice) b.classList.add('wrong'); });
        c.querySelector('#qfb').innerHTML=`<p><b>${p.name} 選了「${choice}」，${correct?'答對了！':'答錯了。'}</b></p><div class="fact">${q.e}</div>`; SND.play(correct?'right':'wrong'); setTimeout(()=>close(),1900*speed()); },900*speed()); }});
  } else {
    correct=await modal({emoji:'🔬',title:'自然科學挑戰站',sub:`答對 +$${fmt(reward)}，${penalty?`答錯 -$${fmt(penalty)}`:'答錯不扣款'}`,body,buttons:[],onMount:(c,close)=>{
      c.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
        const o=opts[+b.dataset.k], ok=o===q.a; c.querySelectorAll('.opts button').forEach(x=>{ x.disabled=true; if(opts[+x.dataset.k]===q.a) x.classList.add('right'); }); if(!ok) b.classList.add('wrong');
        SND.play(ok?'right':'wrong');
        c.querySelector('#qfb').innerHTML=`<p><b>${ok?'答對了！':'答錯了，正確答案是「'+q.a+'」。'}</b></p><div class="fact">${q.e}</div><div class="mbtns"><button class="btn primary" id="qok">繼續</button></div>`;
        c.querySelector('#qok').onclick=()=>close(ok); c.querySelector('#qok').focus();
      }); }});
  }
  addFact(p,q.e);
  if(correct){ p.quizR++; gain(p,reward,'答對科學題'); } else if(penalty)await pay(p,penalty,null,'答錯科學題');else log(`${p.name} 完成自然知識練習，這次不扣款`,p);
}

/* ---------------- 道具卡 ---------------- */
function opponents(p){ return alive().filter(q=>q!==p); }
function consume(p,key,targetsOther){
  if(p.char==='monkey' && targetsOther && Math.random()<.3){ log(`${p.name} 調皮搗蛋，「${ITEMS[key].name}」沒有被用掉！`,p); floatText(p,'嘻嘻！卡片還在','#E9A90F'); return; }
  const k=p.items.indexOf(key); if(k>=0) p.items.splice(k,1);
}
function canUse(p,key){
  if(key==='free') return false;
  if(key==='seize'){ const st=G.tiles[p.pos]; return TILES[p.pos].type==='land' && st.owner>=0 && st.owner!==p.id; }
  if(key==='demolish') return G.tiles.some(s=>s.owner>=0&&s.owner!==p.id&&s.level>0);
  if(key==='dispel') return !!(p.spirit && !SPIRITS[p.spirit.type].good);
  if(key==='reverse'||key==='equal') return opponents(p).length>0;
  return true;
}
function applyBarrier(p,k){ const i=(p.pos+k)%N; if(!G.barriers.includes(i)) G.barriers.push(i); syncBarriers(); consume(p,'barrier',false); SND.play('bump'); log(`${p.name} 在「${TILES[i].name}」放了路障`,p); }
function applyReverse(p,q){ q.reverse=true; consume(p,'reverse',true); SND.play('card'); log(`${p.name} 對 ${q.name} 使用轉向卡`,p); }
function applySeize(p){ const i=p.pos, st=G.tiles[i]; const old=G.players[st.owner]; st.owner=p.id; syncTile(i); burst(tilePos(i).add(new THREE.Vector3(0,1,0)),p.color); consume(p,'seize',true); SND.play('good'); log(`${p.name} 用搶地卡搶下 ${old.name} 的「${TILES[i].name}」！`,p); }
function applyDemolish(p,i){ const st=G.tiles[i]; st.level--; syncTile(i); burst(tilePos(i).add(new THREE.Vector3(0,1,0)),'#888'); consume(p,'demolish',true); SND.play('bump'); log(`${p.name} 拆除了 ${G.players[st.owner].name} 在「${TILES[i].name}」的設施`,p); }
function applyDispel(p,q){ const type=p.spirit.type; p.spirit=null; q.spirit={type,left:SPIRITS[type].turns}; consume(p,'dispel',true); SND.play('spirit'); log(`${p.name} 把 ${SPIRITS[type].name} 送給了 ${q.name}`,p); }
function applyEqual(p){ const al=alive(); const sum=al.reduce((s,q)=>s+q.cash,0); const avg=Math.floor(sum/al.length); al.forEach(q=>q.cash=avg); consume(p,'equal',true); SND.play('good'); log(`${p.name} 使用均富卡，每人現金變成 $${fmt(avg)}`,p); }

async function chooseOpponent(p,title){
  const ops=opponents(p);
  return modal({title,body:'<p>選一位對手：</p>',buttons:[...ops.map(q=>({label:`${CHAR[q.char].emoji} ${q.name}（$${fmt(q.cash)}）`,value:q.id})),{label:'取消',value:null}]}).then(v=>v==null?null:G.players[v]);
}
async function humanUseItems(p){
  const key=await modal({title:'我的道具卡',sub:'擲骰子前可以使用',wide:true,buttons:[{label:'關閉',value:null}],
    body:`<div class="items">${p.items.map((k,idx)=>{ const it=ITEMS[k]; const ok=canUse(p,k); return `<button data-k="${k}" ${ok?'':'disabled'}><span class="ie">${it.emoji}</span><b>${it.name}</b><small>${it.desc}${k==='free'?'':ok?'':'（現在不能用）'}</small></button>`; }).join('')}</div>`,
    onMount:(c,close)=>c.querySelectorAll('.items button').forEach(b=>b.onclick=()=>close(b.dataset.k))});
  if(!key) return null;
  if(key==='remote'){
    const n=await modal({emoji:'🎯',title:'遙控骰子',body:`<p>這次要走幾步？</p><div class="numgrid">${Array.from({length:12},(_,i)=>`<button data-n="${i+1}">${i+1}</button>`).join('')}</div><p style="font-size:.85rem;color:var(--muted);margin-top:8px">${[...Array(12)].map((_,i)=>{ const j=(p.pos+i+1)%N; return `${i+1}→${TILES[j].name}`; }).join('・')}</p>`,buttons:[{label:'取消',value:null}],onMount:(c,close)=>c.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>close(+b.dataset.n))});
    if(!n) return null; consume(p,'remote',false); return {steps:n};
  }
  if(key==='barrier'){
    const n=await modal({emoji:'🚧',title:'放路障',body:`<p>要放在前方第幾格？</p><div class="numgrid">${Array.from({length:8},(_,i)=>`<button data-n="${i+1}" title="${TILES[(p.pos+i+1)%N].name}">${i+1}</button>`).join('')}</div><p style="font-size:.85rem;color:var(--muted);margin-top:8px">${[...Array(8)].map((_,i)=>`${i+1}→${TILES[(p.pos+i+1)%N].name}`).join('・')}</p>`,buttons:[{label:'取消',value:null}],onMount:(c,close)=>c.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>close(+b.dataset.n))});
    if(n) applyBarrier(p,n); return null;
  }
  if(key==='reverse'){ const q=await chooseOpponent(p,'要讓誰倒著走？'); if(q) applyReverse(p,q); return null; }
  if(key==='seize'){ applySeize(p); return null; }
  if(key==='demolish'){
    const list=G.tiles.map((s,i)=>({s,i})).filter(o=>o.s.owner>=0&&o.s.owner!==p.id&&o.s.level>0);
    const i=await modal({emoji:'💥',title:'要拆哪一處設施？',buttons:[...list.map(o=>({label:`${TILES[o.i].emoji} ${TILES[o.i].name}（${G.players[o.s.owner].name}・${LEVEL_NAMES[o.s.level]}）`,value:o.i})),{label:'取消',value:null}]});
    if(i!=null) applyDemolish(p,i); return null;
  }
  if(key==='dispel'){ const q=await chooseOpponent(p,`把 ${SPIRITS[p.spirit.type].name} 送給誰？`); if(q) applyDispel(p,q); return null; }
  if(key==='equal'){ const ok=await modal({emoji:'⚖️',title:'使用均富卡？',body:`<p>所有人的現金加起來平分，每人會變成 $${fmt(Math.floor(alive().reduce((s,q)=>s+q.cash,0)/alive().length))}。</p>`,buttons:[{label:'取消',value:false},{label:'使用',value:true,cls:'primary'}]}); if(ok) applyEqual(p); return null; }
  return null;
}

/* ---------------- 電腦 AI ---------------- */
function cpuReserve(){ return {easy:1500,normal:3000,hard:2500}[G.settings.diff]; }
function cpuWantsBuy(p,cost,i){
  const d=G.settings.diff; const after=p.cash-cost;
  if(d==='easy') return after>=cpuReserve() && Math.random()<.75;
  const t=TILES[i]; const sameRegion=TILES.filter((u,j)=>u.type==='land'&&u.region===t.region&&G.tiles[j].owner===p.id).length;
  if(d==='hard' && sameRegion>0) return after>=800;
  return after>=cpuReserve();
}
function cpuWantsUpgrade(p,cost){ const d=G.settings.diff; const after=p.cash-cost; if(d==='easy') return after>=4000&&Math.random()<.6; return after>=(d==='hard'?3000:4500); }
async function cpuPreRoll(p){
  const d=G.settings.diff; const useChance={easy:.3,normal:.65,hard:1}[d];
  let steps=null; const say=async(k,extra='')=>{ floatText(p,`${ITEMS[k].emoji} ${ITEMS[k].name}`,'#1C7DB5'); await modal({emoji:ITEMS[k].emoji,title:`${p.name} 使用「${ITEMS[k].name}」`,body:`<p>${extra||ITEMS[k].desc}</p>`,auto:1500,buttons:[]}); };
  if(!p.items.length || Math.random()>useChance){ await wait(400); return null; }
  const ops=opponents(p); const leader=ops.slice().sort((a,b)=>totalAssets(b)-totalAssets(a))[0];
  if(p.items.includes('dispel') && canUse(p,'dispel') && leader){ applyDispel(p,leader); await say('dispel',`把壞精靈送給了 ${leader.name}！`); }
  if(p.items.includes('seize') && canUse(p,'seize')){ const t=TILES[p.pos]; applySeize(p); await say('seize',`搶下了「${t.name}」！`); }
  if(p.items.includes('demolish') && canUse(p,'demolish')){ const list=G.tiles.map((s,i)=>({s,i})).filter(o=>o.s.owner>=0&&o.s.owner!==p.id&&o.s.level>0).sort((a,b)=>b.s.level-a.s.level); if(list[0].s.level>=2||d==='hard'){ applyDemolish(p,list[0].i); await say('demolish',`拆了「${TILES[list[0].i].name}」的設施！`); } }
  if(p.items.includes('equal') && ops.length){ const avg=alive().reduce((s,q)=>s+q.cash,0)/alive().length; if(p.cash<avg*.55){ applyEqual(p); await say('equal'); } }
  if(p.items.includes('reverse') && leader && Math.random()<.5){ applyReverse(p,leader); await say('reverse',`${leader.name} 下次要倒著走！`); }
  if(p.items.includes('barrier')){ for(let k=1;k<=8;k++){ const j=(p.pos+k)%N; const st=G.tiles[j]; if(st.owner===p.id && st.level>=1 && !G.barriers.includes(j)){ applyBarrier(p,k); await say('barrier',`在「${TILES[j].name}」前放了路障！`); break; } } }
  if(p.items.includes('remote')){
    let best=null,bestScore=-1e9;
    for(let n=1;n<=12;n++){ const j=(p.pos+n)%N; const t=TILES[j], st=G.tiles[j]; let sc=0;
      if(t.type==='land'){ if(st.owner<0) sc=p.cash>=buyCost(p,j)?t.price/100:0; else if(st.owner===p.id) sc=st.level<MAX_BUILD_LEVEL&&p.cash>upCost(p,j)?t.up/100:2; else sc=-rentOf(j,p)/100; }
      else if(t.type==='quiz') sc=6; else if(t.type==='chance') sc=5; else if(t.type==='supply') sc=7; else if(t.type==='police') sc=-25; else if(t.type==='hospital') sc=-10; else if(t.type==='fate') sc=-3;
      if(p.pos+n>=N) sc+=20;
      if(sc>bestScore){ bestScore=sc; best=n; } }
    const worstAhead=[...Array(12)].map((_,n)=>{ const j=(p.pos+n+1)%N; return G.tiles[j].owner>=0&&G.tiles[j].owner!==p.id?rentOf(j,p):0; }).reduce((a,b)=>Math.max(a,b),0);
    if(best && (d==='hard'||bestScore>=15||worstAhead>2000)){ consume(p,'remote',false); steps=best; await say('remote',`決定走 ${best} 步！`); }
  }
  renderPlayers();
  return steps;
}

 {id:'facts',name:'自然觀察家',desc:'收集 5 則不同自然知識',target:5},
 {id:'bank',name:'未雨綢繆',desc:'銀行存款達 $5,000',target:5000},
 {id:'set',name:'棲地守護者',desc:'集滿 1 個完整棲地',target:1},
 {id:'trade',name:'友善協商家',desc:'完成 1 次土地交易',target:1}
];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initExpansion(){
 G.v=3;
 G.players.forEach(p=>{
  if(!p.missions) p.missions=shuffle(MISSIONS.slice()).slice(0,2).map(m=>({id:m.id,done:false}));
  p.skillReady??=1; p.tradeCount??=0; p.tradeTurn??=-1;
 });
}
function owned(p){return G.tiles.map((s,i)=>({s,i})).filter(o=>o.s.owner===p.id);}
function missionProgress(p,id){
 const lands=owned(p);
 return ({lands:()=>lands.length,regions:()=>new Set(lands.map(o=>TILES[o.i].region)).size,
  build:()=>lands.reduce((n,o)=>n+o.s.level,0),quiz:()=>p.quizR,facts:()=>p.facts.length,
  bank:()=>p.deposit,set:()=>lands.some(o=>regionFull(o.i))?1:0,trade:()=>p.tradeCount})[id]();
}
function checkMissions(p){
 if(p.out) return;
 (p.missions||[]).forEach(m=>{const def=MISSIONS.find(d=>d.id===m.id);
  if(def&&!m.done&&missionProgress(p,m.id)>=def.target){m.done=true;gain(p,2000,'完成一項祕密任務');}
 });
}
async function showMissions(p){
 await modal({emoji:'🔒',title:'祕密任務交接',body:`<p>請把畫面交給 <b>${esc(p.name)}</b>，其他玩家先移開視線。</p>`,buttons:[{label:'我是本人，查看任務',value:true,cls:'primary'}]});
 checkMissions(p);
 await modal({emoji:'🎯',title:`${esc(p.name)} 的祕密任務`,sub:'每項完成獎勵 $2,000；完成後不會因出售土地而收回獎金。',body:p.missions.map(m=>{
  const d=MISSIONS.find(d=>d.id===m.id),n=Math.min(d.target,missionProgress(p,m.id));
  return `<div class="mission-card"><b>${m.done?'✅':'🎯'} ${d.name}</b><p>${d.desc}</p><progress max="${d.target}" value="${m.done?d.target:n}"></progress><div>${m.done?'已完成並領獎':`${fmt(n)} / ${fmt(d.target)}`}</div></div>`;
 }).join('')});
 save();
}
function skillAvailable(p){
 if(p.turns<p.skillReady) return false;
 if(['rabbit','monkey'].includes(p.char)) return p.items.length<MAX_ITEMS;
 if(p.char==='turtle') return !p.quizBoost;
 if(p.char==='fox') return owned(p).some(o=>o.s.level<MAX_BUILD_LEVEL&&p.cash>=Math.ceil(upCost(p,o.i)/2));
 return true;
}
async function useActive(p){
 if(!skillAvailable(p)) return;
 const a=ACTIVE[p.char]; let selected;
 if(p.char==='fox'){
  const options=owned(p).filter(o=>o.s.level<MAX_BUILD_LEVEL&&p.cash>=Math.ceil(upCost(p,o.i)/2));
  selected=p.cpu?options.sort((a,b)=>b.s.level-a.s.level)[0].i:await modal({emoji:'🦊',title:a.name,body:'<p>選擇土地立即升一級。</p>',buttons:[...options.map(o=>({label:`${TILES[o.i].name} → ${LEVEL_NAMES[o.s.level+1]} $${fmt(Math.ceil(upCost(p,o.i)/2))}`,value:o.i})),{label:'取消',value:null}]});
  if(selected==null) return;
 }else if(!p.cpu){
  const ok=await modal({emoji:CHAR[p.char].emoji,title:a.name,body:`<p>${a.desc}</p><p>使用後第 ${p.turns+3} 個自己的回合恢復。</p>`,buttons:[{label:'取消',value:false},{label:'使用技能',value:true,cls:'primary'}]});
  if(!ok) return;
 }
 p.skillReady=p.turns+3;
 if(p.char==='bear') gain(p,1200,'獲得森林補助');
 if(p.char==='peacock') gain(p,clamp(Math.round(p.deposit*.08),600,1600),'募款成功');
 if(p.char==='rabbit'||p.char==='monkey') await giveItem(p,p.char==='rabbit'?'remote':'barrier','使用技能得到');
 if(p.char==='turtle') p.quizBoost=true;
 if(p.char==='fox'){p.cash-=Math.ceil(upCost(p,selected)/2);G.tiles[selected].level++;await growBuilding(selected);}
 log(`${p.name} 使用主動技能「${a.name}」`,p); checkMissions(p);renderPlayers();
}
function updateExpansionDock(p){
 $('#itemBtn').textContent='🎴 道具 '+p.items.length; $('#itemBtn').disabled=p.items.length===0;
 const left=Math.max(0,p.skillReady-p.turns);
 $('#skillBtn').textContent=left?`✨ 冷卻 ${left}`:`✨ ${ACTIVE[p.char].name}`;
 $('#skillBtn').disabled=!skillAvailable(p);
 $('#tradeBtn').disabled=p.tradeTurn===p.turns;
}
async function auctionLand(i){
 const tile=TILES[i];let bidders=alive().slice(),bid=Math.ceil(tile.price*.5/100)*100,winner=null;
 log(`「${tile.name}」進入拍賣，底價 $${fmt(bid)}`);
 while(bidders.some(p=>p!==winner)){
  for(const p of bidders.slice()){
   if(!bidders.includes(p)||p===winner) continue;
   const next=winner?bid+200:bid;
   if(p.cash<next){bidders=bidders.filter(q=>q!==p);continue;}
   let yes;
   if(p.cpu){
    const same=owned(p).filter(o=>TILES[o.i].region===tile.region).length;
    const cap=Math.floor(tile.price*(same===2?1.45:same?1.1:.85));
    yes=next<=cap&&p.cash-next>=cpuReserve();
   }else{
    yes=await modal({emoji:'🔨',title:`拍賣：${tile.name}`,sub:`請 ${esc(p.name)} 決定`,body:`<p>目前${winner?`${esc(winner.name)} 出價 $${fmt(bid)}`:'尚無人出價'}。</p><p>你的現金 $${fmt(p.cash)}。本次出價 <b>$${fmt(next)}</b>。</p><p>退出後本場不能重新加入。設施等級：${LEVEL_NAMES[G.tiles[i].level]}。</p>`,buttons:[{label:'退出競標',value:false},{label:`出價 $${fmt(next)}`,value:true,cls:'primary'}]});
   }
   if(yes){bid=next;winner=p;log(`${p.name} 競標出價 $${fmt(bid)}`,p);}
   else bidders=bidders.filter(q=>q!==p);
  }
 }
 if(winner){winner.cash-=bid;G.tiles[i].owner=winner.id;syncTile(i);SND.play('buy');log(`${winner.name} 以 $${fmt(bid)} 標下「${tile.name}」`,winner);checkMissions(winner);}
 else log(`「${tile.name}」流標，仍為無主土地`);
 renderPlayers();
 await modal({emoji:'🔨',title:'拍賣結果',body:`<p>${winner?`${esc(winner.name)} 以 $${fmt(bid)} 標下 ${tile.name}！`:'無人出價，土地保留給下一位探險家。'}</p>`,auto:1800,buttons:[]});
}
function landValue(i){return TILES[i].price+buildUnits(G.tiles[i].level)*TILES[i].up;}
function validTrade(p,q,offer,request,cash){
 return p!==q&&!p.out&&!q.out&&p.tradeTurn!==p.turns&&Number.isInteger(cash)&&
  (offer===-1||G.tiles[offer]?.owner===p.id)&&(request===-1||G.tiles[request]?.owner===q.id)&&
  (offer>=0||request>=0)&&p.cash>=Math.max(0,cash)&&q.cash>=Math.max(0,-cash);
}
function cpuAcceptTrade(p,q,offer,request,cash){
 const received=(offer>=0?landValue(offer):0)+cash,paid=request>=0?landValue(request):0;
 // Completing a habitat costs more; AI never grants an unexplained bargain.
 const premium=request>=0&&owned(p).filter(o=>TILES[o.i].region===TILES[request].region).length===2?1.35:1.1;
 return received>=paid*premium&&q.cash+cash>=cpuReserve();
}
async function proposeTrade(p,q,offer,request,cash){
 if(!validTrade(p,q,offer,request,cash)) return false;
 const desc=`<p><b>${esc(p.name)}</b> 提供：${offer>=0?TILES[offer].name+'（'+LEVEL_NAMES[G.tiles[offer].level]+'）':'無土地'}${cash>0?' ＋ $'+fmt(cash):''}</p><p><b>${esc(q.name)}</b> 提供：${request>=0?TILES[request].name+'（'+LEVEL_NAMES[G.tiles[request].level]+'）':'無土地'}${cash<0?' ＋ $'+fmt(-cash):''}</p><p>土地連同設施轉移；只有雙方同意才成交。</p>`;
 const yes=q.cpu?cpuAcceptTrade(p,q,offer,request,cash):await modal({emoji:'🤝',title:`請 ${esc(q.name)} 審核交易`,body:desc,buttons:[{label:'拒絕',value:false},{label:'同意交易',value:true,cls:'primary'}]});
 if(!yes){log(`${q.name} 拒絕了交易`,q);await modal({emoji:'🤝',title:'交易未成立',body:'<p>對方未接受提議，資產沒有變動。</p>',auto:p.cpu?1400:0});return false;}
 if(!validTrade(p,q,offer,request,cash)) return false;
 p.cash-=cash;q.cash+=cash;
 if(offer>=0){G.tiles[offer].owner=q.id;syncTile(offer);}
 if(request>=0){G.tiles[request].owner=p.id;syncTile(request);}
 p.tradeTurn=p.turns;p.tradeCount++;q.tradeCount++;
 log(`${p.name} 與 ${q.name} 完成土地交易`,p);checkMissions(p);checkMissions(q);renderPlayers();
 await modal({emoji:'🤝',title:'交易成功',body:desc,auto: p.cpu&&q.cpu?1500:0});return true;
}
async function tradeMenu(p){
 if(p.tradeTurn===p.turns) return;
 const q=await chooseOpponent(p,'選擇交易對象');if(!q) return;
 const opts=player=>'<option value="-1">無土地</option>'+owned(player).map(o=>`<option value="${o.i}">${TILES[o.i].name}｜${LEVEL_NAMES[o.s.level]}｜資產 $${fmt(landValue(o.i))}</option>`).join('');
 const deal=await modal({emoji:'🤝',title:`與 ${esc(q.name)} 交易`,wide:true,body:`<div class="trade-form"><label>你提供的土地<select id="offerLand">${opts(p)}</select></label><label>希望對方提供的土地<select id="requestLand">${opts(q)}</select></label><label>現金方向<select id="cashDir"><option value="1">我付給對方</option><option value="-1">對方付給我</option></select></label><label>現金金額（只使用現金）<input id="tradeCash" type="number" min="0" step="100" value="0"></label><p>你的現金 $${fmt(p.cash)}／對方現金 $${fmt(q.cash)}。至少選一塊土地。</p><p id="tradeError" role="alert"></p><button class="btn primary" id="submitTrade">預覽提議</button></div>`,buttons:[{label:'取消',value:null}],onMount:(c,close)=>{
  c.querySelector('#submitTrade').onclick=()=>{
   const offer=+c.querySelector('#offerLand').value,request=+c.querySelector('#requestLand').value;
   const raw=c.querySelector('#tradeCash').value,amount=Number(raw),cash=amount*+c.querySelector('#cashDir').value;
   if(raw===''||amount<0||!validTrade(p,q,offer,request,cash)){c.querySelector('#tradeError').textContent='請選擇至少一塊土地，並確認付款方有足夠現金、金額為整數。';return;}
   close({offer,request,cash});
  };
 }});
 if(!deal)return;
 const {offer,request,cash}=deal;
 const confirm=await modal({emoji:'🤝',title:'確認送出交易',body:`<p>你提供：${offer>=0?TILES[offer].name:'無土地'}${cash>0?' ＋ $'+fmt(cash):''}</p><p>你取得：${request>=0?TILES[request].name:'無土地'}${cash<0?' ＋ $'+fmt(-cash):''}</p>`,buttons:[{label:'取消',value:false},{label:'送給對方確認',value:true,cls:'primary'}]});
 if(confirm)await proposeTrade(p,q,offer,request,cash);
}
async function cpuExpansion(p){
 if(skillAvailable(p))await useActive(p);
 if(p.tradeTurn===p.turns||p.turns%3!==0)return;
 const options=G.tiles.map((s,i)=>({s,i})).filter(o=>o.s.owner>=0&&o.s.owner!==p.id&&owned(p).filter(a=>TILES[a.i].region===TILES[o.i].region).length===2);
 for(const o of options){const cash=Math.ceil(landValue(o.i)*1.4/100)*100;
  if(p.cash-cash<cpuReserve())continue;
  await proposeTrade(p,G.players[o.s.owner],-1,o.i,cash);break;
 }
}
function bindExpansion(){
 for(const [id,fn] of [['missionBtn',showMissions],['tradeBtn',tradeMenu],['skillBtn',useActive]]){
  $('#'+id).onclick=async()=>{
   if(!preRollResolve||modalOpen)return;
   const p=G.players[G.cur];$('#dock').hidden=true;
   try{await fn(p);checkMissions(p);save();}
   finally{if(preRollResolve){updateExpansionDock(p);$('#dock').hidden=false;}}
  };
 }
}

let fitRequest=0;
function requestViewportFit(){if(fitRequest)return;fitRequest=requestAnimationFrame(()=>{fitRequest=0;fitGameViewport();});}
function fitGameViewport(){
 const w=Math.round(window.visualViewport?.width||innerWidth),h=Math.round(window.visualViewport?.height||innerHeight);
 document.documentElement.style.setProperty('--game-width',w+'px');document.documentElement.style.setProperty('--game-height',h+'px');
 const setupEl=$('#setup'),inner=$('.setup-inner');
 if(!setupEl.hidden&&inner){
  const width=Math.min(1080,w-16);inner.style.width=width+'px';
  const naturalH=inner.offsetHeight,desired=Math.min(1.6,Math.max(1,Math.min(w/1200,h/850)));
  const scale=Math.min(desired,(w-20)/width,(h-32)/Math.max(1,naturalH));
  inner.style.zoom=String(scale);
 }
 const card=$('#mcard');if(!$('#modal').hidden){
  card.style.width=Math.min(card.classList.contains('wide')?760:520,w-20)+'px';
  const naturalH=card.offsetHeight,scale=Math.min(1.4,Math.max(1,Math.min(w/1400,h/950)),(h-20)/Math.max(1,naturalH));
  card.style.zoom=String(Math.min(scale,(w-20)/card.offsetWidth));
 }
 document.documentElement.style.setProperty('--players-height',$('#players').offsetHeight+'px');
 document.documentElement.style.setProperty('--dock-height',Math.max(40,$('#dock').offsetHeight)+'px');
}
function compactRuleView(c){
 const rules=c.querySelector('.rules');if(!rules)return;
 const sections=[];let active=null;
 for(const child of [...rules.children]){if(child.tagName==='H4'){active=document.createElement('div');active.className='rules-section';sections.push({name:child.textContent,el:active});}if(active)active.appendChild(child);}
 const select=document.createElement('select');select.className='rules-select';select.setAttribute('aria-label','選擇規則章節');
 sections.forEach((s,i)=>{select.add(new Option(s.name,String(i)));s.el.hidden=i!==0;});
 rules.replaceChildren(select,...sections.map(s=>s.el));select.onchange=()=>{sections.forEach((s,i)=>s.el.hidden=i!==+select.value);requestViewportFit();};
}
async function showGameHistory(){
 if(!G||modalOpen||!preRollResolve)return;
 const entries=G.log.slice(),last=entries.length-1;if(last<0)return;
 await modal({emoji:'📜',title:'遊戲紀錄',body:`<p class="log-detail" id="historyText">${esc(entries[last].t)}</p><label>拖曳選擇紀錄 <span id="historyIndex">${last+1} / ${entries.length}</span><input class="log-range" type="range" min="0" max="${last}" value="${last}" aria-label="選擇遊戲紀錄"></label>`,onMount:c=>{c.querySelector('input').oninput=e=>{const i=+e.target.value;c.querySelector('#historyText').textContent=entries[i].t;c.querySelector('#historyIndex').textContent=`${i+1} / ${entries.length}`;requestViewportFit();};}});
}
async function boot(){
  try{ await Promise.race([document.fonts.load('40px Huninn'),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  buildScene(); initSetup(); bindHud(); bindExpansion();
  window.addEventListener('resize',requestViewportFit);window.visualViewport?.addEventListener('resize',requestViewportFit);
  document.fonts.ready.then(requestViewportFit);document.fonts.addEventListener('loadingdone',requestViewportFit);
  const fitObserver=new MutationObserver(requestViewportFit);fitObserver.observe($('#mcard'),{childList:true,subtree:true,characterData:true});
  const hudObserver=new ResizeObserver(requestViewportFit);hudObserver.observe($('#dock'));hudObserver.observe($('#players'));
  $('#log').title='點選查看完整紀錄';
  requestViewportFit();
}
if(window.THREE) boot(); else window.addEventListener('three-ready',boot,{once:true});
</script>
